[package]
name = "sampo-studio"
# Not the app version: that lives only in package.json (tauri.conf.json points there).
version = "0.0.0"
description = "Story and dialogue boards for game teams"
authors = ["SAMPO Studio"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sampo_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
# Already in the tree through the updater; used here for the .sampo package format.
zip = { version = "4.6", default-features = false }
sha2 = "0.10"
# Already in the tree through zip: checksums for files added to a package in place.
crc32fast = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Not "abort": a bug in one command must fail that command, not close the app mid-song.
panic = "unwind"
strip = true
