name: Release

# Builds the Windows installer whenever a version tag is pushed, e.g. `git tag v0.2.0`.
# The installer is attached to a draft GitHub release, ready to publish and download.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # Version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SAMPO Studio ${{ github.ref_name }}
          releaseBody: Download the setup file below and run it. No administrator rights needed.
          releaseDraft: true
